[project]
name = "calibre2audio"
version = "0.1.0"
description = "Turn a stretch of a Calibre book into a single MP3 you can listen to on a run, starting from where you are on your Kindle."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kokoro>=0.9.4",
    "torch>=2.7",
    "soundfile>=0.12",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
calibre2audio = "calibre2audio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibre2audio"]

# Pull PyTorch from the CUDA 12.8 index so we get sm_120 (Blackwell) kernels.
# These wheels run fine against the locally installed CUDA 13 driver.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
